[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kg-system"
version = "0.1.0"
description = "LLM-driven knowledge graph construction & analysis system (skeleton)"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "langchain>=0.3",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "langchain-anthropic>=0.2",
    "langgraph>=0.2",
    "neo4j>=5.25",
    "redis[hiredis]>=5.2",
    "httpx>=0.27",
    "structlog>=24.4",
    "python-jose[cryptography]>=3.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "httpx>=0.27",
    "respx>=0.21",
    "asgi-lifespan>=2.1",
    "fakeredis[lua]>=2.26",
    "ruff>=0.7",
    "mypy>=1.13",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"kg_system" = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=kg_system --cov-report=term-missing"
markers = [
    "unit: Unit tests (fast, no external deps)",
    "integration: Integration tests (require containers)",
    "e2e: End-to-end tests (require full stack)",
]
